# demandcast configuration
data:
  raw_dir: data/raw
  daily_csv: data/processed/daily_units.csv

# Time-based split. Everything before test_start is training/validation history.
# Model specs below were chosen on a validation window (2011-06-01 to 2011-08-31)
# BEFORE the test period was evaluated.
split:
  test_start: "2011-09-01"

backtest:
  horizon_days: 7    # forecast one week ahead...
  step_days: 7       # ...re-forecasting every week (weekly planning cycle)

models: [seasonal_naive, linear_regression, sarima]

linear_regression:
  log_target: true

sarima:
  order: [1, 0, 0]
  seasonal_order: [0, 1, 1, 7]
  log_target: true

capacity:
  # ASSUMED daily pick/pack capacity in units. This is a planning parameter, NOT part of
  # the UCI dataset; 30,000 is roughly the 90th percentile of historical open-day volume.
  # Set your own site's figure, or null to derive it from `percentile` of training history.
  units_per_day: 30000
  percentile: 90

eda:
  outlier_ratio_high: 2.5   # day > 2.5x its local same-weekday median
  outlier_ratio_low: 0.4

forecast:
  model: linear_regression   # backtest winner; SARIMA has no annual seasonality (see README)
  days: 28
